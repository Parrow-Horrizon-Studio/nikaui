name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Exact steps, or a link to a minimal reproduction.
    validations:
      required: true

  - type: input
    id: component
    attributes:
      label: Component
      placeholder: button

  - type: input
    id: version
    attributes:
      label: Nika UI version
      placeholder: 0.1.0
    validations:
      required: true

  - type: dropdown
    id: framework
    attributes:
      label: Framework
      options:
        - Next.js
        - Vite
        - Remix
        - TanStack Start
        - Other
    validations:
      required: true
