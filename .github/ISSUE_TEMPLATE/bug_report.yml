name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Exact steps, or a link to a minimal reproduction.
    validations:
      required: true

  - type: input
    id: component
    attributes:
      label: Component
      placeholder: button

  - type: input
    id: version
    attributes:
      label: Nika UI version or commit SHA
      description: Nothing is published yet, so a commit SHA (e.g. from `npx nikaui@<sha>`) or "main" is fine.
      placeholder: "e.g. 1d449e8, or main"
    validations:
      required: false

  - type: dropdown
    id: framework
    attributes:
      label: Framework
      options:
        - Next.js
        - Vite
        - Remix
        - TanStack Start
        - Other
    validations:
      required: true
